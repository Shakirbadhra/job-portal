# ===================================================================
# JobConnect Portal Configuration
# ===================================================================

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.whitelabel.enabled=false

# -------------------------------------------------------------------
# Datasource - embedded H2 (file based, zero setup).
# Run with --spring.profiles.active=mysql to use MySQL instead
# (see application-mysql.properties).
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/jobportal_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# File Upload Configuration (Resume storage)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jobportal.upload.resume-dir=uploads/resumes

# -------------------------------------------------------------------
# Business rules
# When true, jobs posted by recruiters start as PENDING and must be
# approved by an admin before they appear in public search.
# -------------------------------------------------------------------
jobportal.jobs.require-approval=false

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.jobportal=INFO
logging.level.org.springframework.web=INFO
