<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Error')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>
<main class="error-page">
    <div style="max-width:520px">
        <div class="error-code" th:text="${status != null ? status : 'Oops'}">Oops</div>
        <h1 class="h3 mt-3 mb-2">Something went wrong</h1>
        <p class="text-muted mb-4" th:text="${message != null and !#strings.isEmpty(message) and message != 'No message available' ? message : 'An unexpected error occurred.'}">An unexpected error occurred.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-primary">Go to homepage</a>
            <a th:href="@{/jobs}" class="btn btn-outline">Browse jobs</a>
        </div>
    </div>
</main>
<footer th:replace="fragments/footer :: footer"></footer>
<th:block th:replace="fragments/footer :: scripts"></th:block>
</body>
</html>
