<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Server error')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>
<main class="error-page">
    <div style="max-width:520px">
        <div class="error-code" th:text="${status != null ? status : '500'}">500</div>
        <h1 class="h3 mt-3 mb-2">Something went wrong on our side</h1>
        <p class="text-muted mb-4" th:text="'We hit an unexpected error. Please try again in a moment.'">We hit an unexpected error.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-primary">Go to homepage</a>
            <a th:href="@{/jobs}" class="btn btn-outline">Browse jobs</a>
        </div>
    </div>
</main>
<footer th:replace="fragments/footer :: footer"></footer>
<th:block th:replace="fragments/footer :: scripts"></th:block>
</body>
</html>
