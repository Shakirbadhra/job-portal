<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Edit job')"></head>
<body>
<div class="app-shell">
    <aside th:replace="fragments/dashboard :: sidebar"></aside>
    <div th:replace="fragments/dashboard :: backdrop"></div>
    <div class="app-main">
        <header th:replace="fragments/dashboard :: topbar('Edit job')"></header>
        <main class="app-content">
            <div class="page-head">
                <div><h1>Edit job</h1><p th:text="${job.title}">Title</p></div>
                <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-outline" target="_blank"><i class="bi bi-eye me-2"></i>View listing</a>
            </div>
            <form th:replace="fragments/jobform :: form('Save changes')"></form>
        </main>
    </div>
</div>
<th:block th:replace="fragments/footer :: scripts"></th:block>
<script th:src="@{/js/dashboards.js}"></script>
<script th:src="@{/js/workspace.js}"></script>
<script th:inline="javascript">Dash.jobForm(/*[[${job}]]*/ null);</script>
</body>
</html>
