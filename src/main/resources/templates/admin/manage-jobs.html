<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Job moderation')"></head>
<body>
<div class="app-shell">
    <aside th:replace="fragments/dashboard :: sidebar"></aside>
    <div th:replace="fragments/dashboard :: backdrop"></div>
    <div class="app-main">
        <header th:replace="fragments/dashboard :: topbar('Job moderation')"></header>
        <main class="app-content">
            <div class="page-head"><div><h1>Job moderation</h1><p>Approve, reject, feature or remove postings.</p></div></div>
            <div class="card-x">
                <div class="tabs-x px-3" id="job-tabs">
                    <button data-status="">All</button><button data-status="PENDING">Pending</button><button data-status="APPROVED">Active</button>
                    <button data-status="REJECTED">Rejected</button><button data-status="CLOSED">Closed</button>
                </div>
                <div class="table-responsive"><table class="table table-x">
                    <thead><tr><th>Job</th><th>Category</th><th>Status</th><th>Applicants</th><th>Posted</th><th class="text-end">Actions</th></tr></thead>
                    <tbody id="jobs-body"></tbody>
                </table></div>
            </div>
            <div id="jobs-pag" class="mt-4"></div>
        </main>
    </div>
</div>
<th:block th:replace="fragments/footer :: scripts"></th:block>
<script th:src="@{/js/dashboards.js}"></script>
<script th:src="@{/js/workspace.js}"></script>
<script>Dash.adminJobs();</script>
</body>
</html>
