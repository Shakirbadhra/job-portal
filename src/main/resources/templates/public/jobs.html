<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Find jobs')"></head>
<body>

<nav th:replace="fragments/header :: navbar"></nav>

<main>
    <section class="page-hero pb-5">
        <div class="container">
            <h1>Find your next role</h1>
            <p class="mb-4">Search verified openings by title, skill, company or location.</p>
            <form id="job-search-form" class="search-panel" role="search">
                <label class="search-field mb-0">
                    <i class="bi bi-search"></i>
                    <span class="visually-hidden">Keyword</span>
                    <input type="text" id="search-keyword" th:value="${initKeyword}" placeholder="Job title, skill or company" autocomplete="off">
                </label>
                <label class="search-field mb-0">
                    <i class="bi bi-geo-alt"></i>
                    <span class="visually-hidden">Location</span>
                    <input type="text" id="search-location" th:value="${initLocation}" placeholder="City or “Remote”" autocomplete="off">
                </label>
                <button type="submit" class="btn btn-primary btn-lg">Search</button>
            </form>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                <!-- Filters -->
                <div class="col-lg-3">
                    <button class="btn btn-outline w-100 d-lg-none mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#filterPanel" aria-expanded="false" aria-controls="filterPanel">
                        <i class="bi bi-sliders me-2"></i>Filters
                    </button>
                    <div class="collapse d-lg-block" id="filterPanel">
                        <div class="card-x card-x-body filter-card">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h2 class="h6 mb-0">Filters</h2>
                                <button type="button" id="btn-reset-filters" class="btn btn-link btn-sm p-0 text-decoration-none">Clear all</button>
                            </div>

                            <div class="filter-group">
                                <label class="group-title" for="filter-category">Category</label>
                                <select id="filter-category" class="form-select">
                                    <option value="">All categories</option>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == initCategory}">Category</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <div class="group-title">Job type</div>
                                <div class="chip-check" data-filter="employmentType">
                                    <input type="radio" name="employmentType" id="et-any" value="" checked><label for="et-any">Any</label>
                                    <input type="radio" name="employmentType" id="et-ft" value="FULL_TIME"><label for="et-ft">Full-time</label>
                                    <input type="radio" name="employmentType" id="et-pt" value="PART_TIME"><label for="et-pt">Part-time</label>
                                    <input type="radio" name="employmentType" id="et-ct" value="CONTRACT"><label for="et-ct">Contract</label>
                                    <input type="radio" name="employmentType" id="et-in" value="INTERNSHIP"><label for="et-in">Internship</label>
                                </div>
                            </div>

                            <div class="filter-group">
                                <div class="group-title">Workplace</div>
                                <div class="chip-check" data-filter="workplaceType">
                                    <input type="radio" name="workplaceType" id="wp-any" value="" checked><label for="wp-any">Any</label>
                                    <input type="radio" name="workplaceType" id="wp-remote" value="REMOTE"><label for="wp-remote">Remote</label>
                                    <input type="radio" name="workplaceType" id="wp-hybrid" value="HYBRID"><label for="wp-hybrid">Hybrid</label>
                                    <input type="radio" name="workplaceType" id="wp-onsite" value="ONSITE"><label for="wp-onsite">On-site</label>
                                </div>
                            </div>

                            <div class="filter-group">
                                <label class="group-title" for="filter-experience">Experience</label>
                                <select id="filter-experience" class="form-select">
                                    <option value="">Any level</option>
                                    <option value="FRESHER">Entry level (0–1 yrs)</option>
                                    <option value="JUNIOR">Junior (1–3 yrs)</option>
                                    <option value="MID_LEVEL">Mid level (3–5 yrs)</option>
                                    <option value="EXPERIENCED">Experienced (5–8 yrs)</option>
                                    <option value="SENIOR">Senior (8+ yrs)</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label class="group-title" for="filter-min-salary">Minimum salary</label>
                                <select id="filter-min-salary" class="form-select">
                                    <option value="">Any salary</option>
                                    <option value="50000">$50k+</option>
                                    <option value="100000">$100k+</option>
                                    <option value="150000">$150k+</option>
                                    <option value="200000">$200k+</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label class="group-title" for="filter-company">Company</label>
                                <select id="filter-company" class="form-select">
                                    <option value="">All companies</option>
                                    <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}">Company</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div class="col-lg-9">
                    <div class="results-toolbar">
                        <div>
                            <div id="results-count" class="fw-semibold text-ink">Searching…</div>
                            <div id="active-filters" class="active-filters mt-2"></div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <label for="sort-by" class="small text-muted text-nowrap">Sort by</label>
                            <select id="sort-by" class="form-select form-select-sm" style="width:auto">
                                <option value="createdAt,desc">Most recent</option>
                                <option value="maxSalary,desc">Highest salary</option>
                                <option value="viewsCount,desc">Most viewed</option>
                                <option value="title,asc">Title A–Z</option>
                            </select>
                            <div class="btn-group view-toggle" role="group" aria-label="Layout">
                                <button type="button" class="btn btn-outline active" data-view="list" aria-label="List view"><i class="bi bi-list-ul"></i></button>
                                <button type="button" class="btn btn-outline" data-view="grid" aria-label="Grid view"><i class="bi bi-grid"></i></button>
                            </div>
                        </div>
                    </div>

                    <div id="jobs-results-container" aria-live="polite"></div>
                    <div id="jobs-pagination" class="mt-4"></div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<th:block th:replace="fragments/footer :: scripts"></th:block>
<script th:inline="javascript">
    window.JOB_SEARCH_INIT = {
        category: /*[[${initCategory}]]*/ '',
        employmentType: /*[[${initEmploymentType}]]*/ '',
        workplaceType: /*[[${initWorkplaceType}]]*/ '',
        experienceLevel: /*[[${initExperienceLevel}]]*/ ''
    };
</script>
<script th:src="@{/js/job-search.js}"></script>
</body>
</html>
