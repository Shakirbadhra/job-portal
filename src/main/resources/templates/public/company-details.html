<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head(${company.name})"></head>
<body>

<nav th:replace="fragments/header :: navbar"></nav>

<main>
    <section class="page-hero" style="padding-bottom:110px">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/companies}">Companies</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${company.name}">Company</li>
                </ol>
            </nav>
        </div>
    </section>

    <div class="container" style="margin-top:-80px; position:relative">
        <div class="card-x p-4 p-lg-5 mb-4">
            <div class="d-flex flex-column flex-md-row gap-4 align-items-md-center">
                <span th:replace="fragments/ui :: logo(${company.name}, ${company.logoUrl}, 'xl')"></span>
                <div class="flex-grow-1">
                    <h1 class="mb-1" style="font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800" th:text="${company.name}">Company</h1>
                    <div class="text-muted mb-3" th:text="${company.industry}">Industry</div>
                    <div class="d-flex flex-wrap gap-2">
                        <span class="tag" th:if="${company.location}"><i class="bi bi-geo-alt"></i><th:block th:text="${company.location}">City</th:block></span>
                        <span class="tag" th:if="${company.companySize}"><i class="bi bi-people"></i><th:block th:text="${company.companySize + ' employees'}">1000+</th:block></span>
                        <span class="tag" th:if="${company.foundedYear}"><i class="bi bi-calendar3"></i><th:block th:text="${'Founded ' + company.foundedYear}">1998</th:block></span>
                    </div>
                </div>
                <div class="d-flex flex-column gap-2 align-items-md-end">
                    <a th:if="${company.website}" th:href="${company.website}" target="_blank" rel="noopener" class="btn btn-outline">
                        <i class="bi bi-box-arrow-up-right me-2"></i>Visit website
                    </a>
                    <a href="#open-roles" class="btn btn-primary">
                        <th:block th:text="${company.openJobsCount + (company.openJobsCount == 1 ? ' open role' : ' open roles')}">4 open roles</th:block>
                    </a>
                </div>
            </div>
        </div>

        <div class="row g-4 pb-5">
            <div class="col-lg-4">
                <div class="card-x card-x-body sticky-aside">
                    <h2 class="h6 mb-3">About <span th:text="${company.name}">Company</span></h2>
                    <div class="prose small" data-format th:text="${company.description != null ? company.description : 'This company has not added a description yet.'}">About</div>
                    <hr class="my-4">
                    <dl class="row small mb-0 g-2">
                        <dt class="col-5 text-muted fw-normal">Industry</dt><dd class="col-7 fw-semibold text-ink mb-0" th:text="${company.industry ?: '—'}">Tech</dd>
                        <dt class="col-5 text-muted fw-normal">Headquarters</dt><dd class="col-7 fw-semibold text-ink mb-0" th:text="${company.location ?: '—'}">City</dd>
                        <dt class="col-5 text-muted fw-normal">Company size</dt><dd class="col-7 fw-semibold text-ink mb-0" th:text="${company.companySize ?: '—'}">1000+</dd>
                        <dt class="col-5 text-muted fw-normal">Founded</dt><dd class="col-7 fw-semibold text-ink mb-0" th:text="${company.foundedYear ?: '—'}">1998</dd>
                    </dl>
                </div>
            </div>
            <div class="col-lg-8" id="open-roles">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 mb-0">Open roles</h2>
                    <span class="small text-muted" id="company-jobs-count"></span>
                </div>
                <div id="company-jobs" class="d-flex flex-column gap-3"></div>
                <div id="company-jobs-pagination" class="mt-4"></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<th:block th:replace="fragments/footer :: scripts"></th:block>
<script th:inline="javascript">
    (function () {
        const companyId = /*[[${company.id}]]*/ 0;
        const box = document.getElementById('company-jobs');
        async function load(page) {
            box.innerHTML = JC.skeletonCards(3);
            try {
                const res = await JC.api('/api/jobs?size=8&page=' + page + '&companyId=' + companyId);
                const data = res.data;
                document.getElementById('company-jobs-count').textContent = data.totalElements + (data.totalElements === 1 ? ' position' : ' positions');
                if (!data.content.length) {
                    box.innerHTML = '<div class="card-x">' + JC.emptyState('bi-briefcase', 'No open roles right now',
                        'This team isn\'t hiring at the moment. Check back soon or explore other companies.',
                        '<a href="/companies" class="btn btn-outline">Browse companies</a>') + '</div>';
                    return;
                }
                box.innerHTML = data.content.map(j => JC.jobCard(j)).join('');
                JC.pagination(document.getElementById('company-jobs-pagination'), data, load);
            } catch (e) {
                box.innerHTML = '<div class="alert-x error"><i class="bi bi-exclamation-octagon"></i><div>' + JC.esc(e.message) + '</div></div>';
            }
        }
        load(0);
    })();
</script>
</body>
</html>
