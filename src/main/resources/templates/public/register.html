<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Create Account')"></head>
<body class="bg-light">
<nav th:replace="fragments/header :: navbar"></nav>

<div class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="bg-white shadow-lg rounded-4 p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-circle text-white mb-3"
                             style="width: 60px; height: 60px; font-size: 1.5rem;">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Create Your Account</h2>
                        <p class="text-muted">Join thousands of professionals on JobConnect</p>
                    </div>

                    <div id="register-error" class="alert alert-danger border-0 rounded-3 d-none" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="error-msg">Error</span>
                    </div>
                    <div id="register-success" class="alert alert-success border-0 rounded-3 d-none" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>Account created successfully! <a th:href="@{/login}" class="fw-bold">Sign in now →</a>
                    </div>

                    <form id="register-form">
                        <!-- Role Selection Tabs -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">I want to:</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="role-seeker" value="JOB_SEEKER" checked>
                                    <label class="btn btn-outline-primary w-100 py-3 fw-bold" for="role-seeker">
                                        <i class="bi bi-search d-block fs-4 mb-1"></i>
                                        Find a Job
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="role-recruiter" value="RECRUITER">
                                    <label class="btn btn-outline-primary w-100 py-3 fw-bold" for="role-recruiter">
                                        <i class="bi bi-building d-block fs-4 mb-1"></i>
                                        Hire Talent
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" name="fullName" placeholder="John Doe" required minlength="2">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="john@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold small">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="At least 6 characters" required minlength="6">
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Recruiter Extra Fields -->
                        <div id="recruiter-fields" class="d-none">
                            <hr class="my-3">
                            <p class="fw-semibold small text-muted mb-3">Company Details (Optional)</p>
                            <div class="mb-3">
                                <label for="companyName" class="form-label fw-semibold small">Company Name</label>
                                <input type="text" class="form-control" id="companyName" name="companyName" placeholder="Acme Inc.">
                            </div>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label for="companyIndustry" class="form-label fw-semibold small">Industry</label>
                                    <input type="text" class="form-control" id="companyIndustry" name="companyIndustry" placeholder="Technology, Finance...">
                                </div>
                                <div class="col-md-6">
                                    <label for="companyWebsite" class="form-label fw-semibold small">Website</label>
                                    <input type="url" class="form-control" id="companyWebsite" name="companyWebsite" placeholder="https://company.com">
                                </div>
                            </div>
                            <div class="mt-2">
                                <label for="designation" class="form-label fw-semibold small">Your Designation</label>
                                <input type="text" class="form-control" id="designation" name="designation" placeholder="e.g. Talent Acquisition Manager">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold fs-6 mt-4" id="btn-register">
                            <i class="bi bi-person-check me-2"></i>Create Account
                        </button>

                        <p class="text-center small text-muted mt-3">
                            By registering you agree to our <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>.
                        </p>
                    </form>

                    <p class="text-center mt-3 small">
                        Already have an account? <a th:href="@{/login}" class="text-primary fw-semibold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>

<script>
    // Toggle recruiter extra fields
    document.querySelectorAll('input[name="role"]').forEach(radio => {
        radio.addEventListener('change', () => {
            const extras = document.getElementById('recruiter-fields');
            extras.classList.toggle('d-none', radio.value !== 'RECRUITER' || !radio.checked);
        });
    });
    document.querySelector('input[value="RECRUITER"]').addEventListener('change', function() {
        document.getElementById('recruiter-fields').classList.remove('d-none');
    });

    // Registration form submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-register');
        const errDiv = document.getElementById('register-error');
        const successDiv = document.getElementById('register-success');
        errDiv.classList.add('d-none');
        successDiv.classList.add('d-none');

        const role = document.querySelector('input[name="role"]:checked').value;
        const payload = {
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            phone: document.getElementById('phone').value.trim(),
            role: role,
            companyName: document.getElementById('companyName').value.trim() || null,
            companyIndustry: document.getElementById('companyIndustry').value.trim() || null,
            companyWebsite: document.getElementById('companyWebsite').value.trim() || null,
            designation: document.getElementById('designation').value.trim() || null
        };

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                successDiv.classList.remove('d-none');
                document.getElementById('register-form').reset();
                btn.innerHTML = '<i class="bi bi-person-check me-2"></i>Account Created!';
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            } else {
                document.getElementById('error-msg').textContent = data.message || 'Registration failed. Please try again.';
                errDiv.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-check me-2"></i>Create Account';
            }
        } catch (err) {
            document.getElementById('error-msg').textContent = 'Network error. Please try again.';
            errDiv.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-check me-2"></i>Create Account';
        }
    });
</script>
</body>
</html>
