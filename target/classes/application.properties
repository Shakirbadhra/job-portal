# ===================================================================
# JobConnect Portal Configuration
# ===================================================================

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------
# Datasource & MySQL Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/jobportal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# File Upload Configuration (Resume storage)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jobportal.upload.resume-dir=uploads/resumes

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.jobportal=INFO
logging.level.org.springframework.web=INFO
