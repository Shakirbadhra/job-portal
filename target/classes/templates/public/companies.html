<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Companies')"></head>
<body class="bg-light">
<nav th:replace="fragments/header :: navbar"></nav>

<div class="bg-white border-bottom py-4">
    <div class="container">
        <h1 class="h3 fw-bold mb-1">Top Companies</h1>
        <p class="text-muted mb-0">Discover great places to work and their open roles</p>
    </div>
</div>

<div class="container py-5">
    <div class="row g-4" id="companies-grid">
        <div class="col-md-4 col-lg-3" th:each="company : ${companies}">
            <a th:href="@{/companies/{id}(id=${company.id})}" class="company-card d-block text-decoration-none h-100">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="company-logo-frame" style="width: 56px; height: 56px; flex-shrink: 0;">
                        <img th:if="${company.logoUrl}" th:src="${company.logoUrl}" th:alt="${company.name}"
                             onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'company-initial\'>' + this.alt.charAt(0) + '</span>';">
                        <span th:unless="${company.logoUrl}" class="company-initial"
                              th:text="${company.name != null ? #strings.substring(company.name,0,1) : 'C'}">C</span>
                    </div>
                    <div>
                        <div class="fw-bold" th:text="${company.name}">Company Name</div>
                        <small class="text-muted" th:text="${company.industry}">Industry</small>
                    </div>
                </div>
                <p class="text-muted small mb-3" style="line-height: 1.5;"
                   th:text="${company.description != null ? #strings.abbreviate(company.description, 100) : 'A leading company'}">Description</p>
                <div class="d-flex flex-wrap gap-2">
                    <span class="badge-tag badge-success-soft" th:text="${company.openJobsCount + ' Open Roles'}">0 roles</span>
                    <span class="badge-tag" th:if="${company.location}" th:text="${company.location}"><i class="bi bi-geo-alt me-1"></i>Location</span>
                </div>
            </a>
        </div>
        <div class="col-12 text-center py-5" th:if="${companies == null or companies.isEmpty()}">
            <i class="bi bi-buildings display-1 text-muted opacity-25 mb-3"></i>
            <h5 class="fw-bold text-muted">No companies found</h5>
            <p class="text-muted">Check back later for new company listings.</p>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
