<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: html-head('Browse Jobs')"></head>
<body class="bg-light">
<nav th:replace="fragments/header :: navbar"></nav>

<!-- Page Header -->
<div class="bg-white border-bottom py-4">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1 class="h3 fw-bold mb-1">Find Your Perfect Job</h1>
                <p class="text-muted mb-0">Search and filter from 32+ active positions</p>
            </div>
            <div class="col-md-6">
                <!-- Quick Search Bar -->
                <div class="d-flex gap-2">
                    <div class="search-input-group flex-grow-1">
                        <i class="bi bi-search text-primary"></i>
                        <input type="text" id="search-keyword" placeholder="Job title, keyword, company..."
                               th:value="${initKeyword}">
                    </div>
                    <div class="search-input-group" style="flex-basis: 170px;">
                        <i class="bi bi-geo-alt text-primary"></i>
                        <input type="text" id="search-location" placeholder="Location..."
                               th:value="${initLocation}">
                    </div>
                    <button class="btn btn-primary-custom px-3" onclick="loadJobs(0)">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container py-4">
    <div class="row g-4">
        <!-- Sidebar Filters -->
        <div class="col-lg-3">
            <form id="job-search-form">
                <div class="filter-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold mb-0">Filters</h6>
                        <button type="button" id="btn-reset-filters" class="btn btn-sm btn-link text-danger p-0 text-decoration-none">
                            <i class="bi bi-x-circle me-1"></i>Reset
                        </button>
                    </div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted text-uppercase">Category</label>
                        <select class="form-select form-select-sm" id="filter-category" th:value="${initCategory}">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                        </select>
                    </div>

                    <!-- Employment Type -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted text-uppercase">Employment Type</label>
                        <select class="form-select form-select-sm" id="filter-employment">
                            <option value="">Any Type</option>
                            <option value="FULL_TIME">Full Time</option>
                            <option value="PART_TIME">Part Time</option>
                            <option value="CONTRACT">Contract</option>
                            <option value="INTERNSHIP">Internship</option>
                        </select>
                    </div>

                    <!-- Workplace Type -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted text-uppercase">Workplace</label>
                        <select class="form-select form-select-sm" id="filter-workplace">
                            <option value="">Any Workplace</option>
                            <option value="REMOTE">Remote</option>
                            <option value="HYBRID">Hybrid</option>
                            <option value="ONSITE">On-site</option>
                        </select>
                    </div>

                    <!-- Experience Level -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted text-uppercase">Experience</label>
                        <select class="form-select form-select-sm" id="filter-experience">
                            <option value="">Any Level</option>
                            <option value="FRESHER">Fresher (0-1 yrs)</option>
                            <option value="JUNIOR">Junior (1-3 yrs)</option>
                            <option value="MID_LEVEL">Mid Level (3-5 yrs)</option>
                            <option value="EXPERIENCED">Experienced (5-8 yrs)</option>
                            <option value="SENIOR">Senior (8+ yrs)</option>
                        </select>
                    </div>

                    <!-- Salary Range -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted text-uppercase">Salary (USD/yr)</label>
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="number" class="form-control form-control-sm" id="filter-min-salary"
                                       placeholder="Min" min="0" step="10000">
                            </div>
                            <div class="col-6">
                                <input type="number" class="form-control form-control-sm" id="filter-max-salary"
                                       placeholder="Max" min="0" step="10000">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100">
                        <i class="bi bi-funnel me-1"></i>Apply Filters
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Area -->
        <div class="col-lg-9">
            <!-- Sort & Count Bar -->
            <div class="d-flex justify-content-between align-items-center mb-3 bg-white rounded-3 p-3 border">
                <div id="results-count" class="text-muted small">Loading jobs...</div>
                <div class="d-flex align-items-center gap-2">
                    <label class="small text-muted fw-semibold mb-0">Sort by:</label>
                    <select class="form-select form-select-sm" id="sort-by" style="width: auto;">
                        <option value="createdAt,desc">Newest First</option>
                        <option value="minSalary,desc">Salary: High to Low</option>
                        <option value="minSalary,asc">Salary: Low to High</option>
                        <option value="title,asc">Job Title A-Z</option>
                    </select>
                </div>
            </div>

            <!-- Job Cards Grid -->
            <div class="row g-3" id="jobs-results-container">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-muted mt-2">Loading jobs...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="mt-4" id="jobs-pagination"></div>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<script th:src="@{/js/job-search.js}"></script>
<script th:inline="javascript">
    // Pre-fill filters from URL params passed via Thymeleaf
    const initCat = /*[[${initCategory}]]*/ '';
    const initEmp = /*[[${initEmploymentType}]]*/ '';
    const initWork = /*[[${initWorkplaceType}]]*/ '';
    const initExp = /*[[${initExperienceLevel}]]*/ '';

    document.addEventListener('DOMContentLoaded', () => {
        if (initCat) document.getElementById('filter-category').value = initCat;
        if (initEmp) document.getElementById('filter-employment').value = initEmp;
        if (initWork) document.getElementById('filter-workplace').value = initWork;
        if (initExp) document.getElementById('filter-experience').value = initExp;
    });
</script>
</body>
</html>
